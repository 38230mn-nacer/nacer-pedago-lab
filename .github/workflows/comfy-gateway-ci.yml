name: Comfy Gateway CI

on:
  pull_request:
    paths:
      - "services/comfy-gateway/**"
      - "workflows/**"
      - ".github/workflows/comfy-gateway-ci.yml"
  push:
    branches:
      - "feat/comfy-services"
    paths:
      - "services/comfy-gateway/**"
      - "workflows/**"
      - ".github/workflows/comfy-gateway-ci.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/comfy-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
